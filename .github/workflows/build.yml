name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner image ships the Android SDK; just make sure API 34 is present.
      - name: Install Android platform
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      # The release key comes from repository secrets when they are set (KEYSTORE_BASE64,
      # KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD); otherwise the key in keystore/ is used.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      # Optional report key: a fine-grained GitHub token for this repository only, with Issues
      # read/write, saved as the REPORT_TOKEN secret. With it, units the launcher does not know yet
      # can send their device report as an issue (at most 3 a day per unit). Without the secret the
      # report is only saved on the unit.
      - name: Report key
        env:
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: |
          if [ -n "$REPORT_TOKEN" ]; then printf '%s' "$REPORT_TOKEN" > app/src/main/assets/report_token; fi

      - name: Build release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # One APK per head-unit family; Software update on the unit picks the matching one.
          ./gradlew assembleQfRelease assembleHzbhdRelease assembleCarsvcRelease assembleSyuRelease assembleHcnRelease assembleUniversalRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/qf/release/app-qf-release.apk TheCarLauncher.apk
          cp app/build/outputs/apk/hzbhd/release/app-hzbhd-release.apk TheCarLauncher_hzbhd.apk
          cp app/build/outputs/apk/carsvc/release/app-carsvc-release.apk TheCarLauncher_carsvc.apk
          cp app/build/outputs/apk/syu/release/app-syu-release.apk TheCarLauncher_syu.apk
          cp app/build/outputs/apk/hcn/release/app-hcn-release.apk TheCarLauncher_hcn.apk
          # The one download for every unit: its setup assistant installs the unit's build over it.
          cp app/build/outputs/apk/universal/release/app-universal-release.apk MibDroid.apk
          # Unit rules: Software update reads them to pick the APK for the unit (also for units added later).
          cp app/src/main/assets/units.json units.json
          echo "VNAME=$(grep -oP "versionName '\K[^']+" app/build.gradle)" >> "$GITHUB_ENV"
          echo "VCODE=$(grep -oP 'versionCode \K[0-9]+' app/build.gradle)" >> "$GITHUB_ENV"
          # Magisk module that installs this APK as a privileged system app.
          bash scripts/build-magisk.sh TheCarLauncher.apk
          cp build/TheCarLauncher-magisk.zip TheCarLauncher-magisk.zip

      - uses: actions/upload-artifact@v5
        with:
          name: TheCarLauncher-apk
          path: |
            TheCarLauncher.apk
            TheCarLauncher_hzbhd.apk
            TheCarLauncher_carsvc.apk
            TheCarLauncher_syu.apk
            TheCarLauncher_hcn.apk
            MibDroid.apk
            units.json
            TheCarLauncher-magisk.zip

      # main publishes the release the launcher updates to ("v4.5.1", marked latest).
      # Other branches publish test builds (pre-releases), offered only with "Test builds" on.
      # The launcher reads versionCode / versionName from the release text.
      - name: What's new (whatsnew.txt into the release)
        run: |
          {
            echo 'WHATSNEW<<WHATSNEW_EOF'
            cat whatsnew.txt 2>/dev/null || true
            echo
            echo 'WHATSNEW_EOF'
          } >> "$GITHUB_ENV"

      - name: Publish release (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VNAME }}
          name: MibDroid ${{ env.VNAME }}
          target_commitish: ${{ github.sha }}
          files: |
            TheCarLauncher.apk
            TheCarLauncher_hzbhd.apk
            TheCarLauncher_carsvc.apk
            TheCarLauncher_syu.apk
            TheCarLauncher_hcn.apk
            MibDroid.apk
            units.json
            TheCarLauncher-magisk.zip
          prerelease: false
          make_latest: true
          body: |
            ## What's new
            ${{ env.WHATSNEW }}

            versionName: ${{ env.VNAME }}
            versionCode: ${{ env.VCODE }}
            Download **MibDroid.apk**: it works on every unit and its setup assistant installs the version made for your unit. Or pick the build for your unit directly: **TheCarLauncher.apk** (UIS7862 / QF units), **TheCarLauncher_hzbhd.apk** (Allwinner T3 / hzbhd units), **TheCarLauncher_carsvc.apk** (android.car firmware units) **TheCarLauncher_syu.apk** (SYU / FYT units) or **TheCarLauncher_hcn.apk** (MediaTek MT8163 / hcn units) below, or update from Setup → Software update on the head unit (it picks the right one). Coming from an older version on a newly supported unit: run Software update twice (the first update brings the QF build, the second switches to the build for your unit).

      - name: Publish test build (other branches)
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MibDroid ${{ env.VNAME }} test build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: |
            TheCarLauncher.apk
            TheCarLauncher_hzbhd.apk
            TheCarLauncher_carsvc.apk
            TheCarLauncher_syu.apk
            TheCarLauncher_hcn.apk
            MibDroid.apk
            units.json
            TheCarLauncher-magisk.zip
          prerelease: true
          make_latest: false
          body: |
            Test build of `${{ github.ref_name }}` at ${{ github.sha }}.

            ## What's new
            ${{ env.WHATSNEW }}

            versionName: ${{ env.VNAME }}
            versionCode: ${{ env.VCODE }}
            Download **MibDroid.apk** (any unit, installs the right build) or **TheCarLauncher.apk** (QF), **TheCarLauncher_hzbhd.apk** (hzbhd), **TheCarLauncher_carsvc.apk** (android.car) **TheCarLauncher_syu.apk** (SYU / FYT) or **TheCarLauncher_hcn.apk** (MT8163 / hcn) below and open it on the head unit to install.
