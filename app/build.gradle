plugins {
    id 'com.android.application'
}

android {
    namespace 'com.thecarlauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.thecarlauncher'
        minSdk 21
        targetSdk 34
        versionCode 68
        versionName '4.6.1'
    }

    signingConfigs {
        // A fixed key so every build (local or CI) installs as an update over the last one.
        // CI passes the key from repository secrets; without them the key in keystore/ is used.
        release {
            def ks = System.getenv('RELEASE_KEYSTORE')
            storeFile ks ? file(ks) : rootProject.file('keystore/release.jks')
            storePassword System.getenv('RELEASE_STORE_PASSWORD') ?: 'carlauncher'
            keyAlias System.getenv('RELEASE_KEY_ALIAS') ?: 'carlauncher'
            keyPassword System.getenv('RELEASE_KEY_PASSWORD') ?: 'carlauncher'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Offline maps (mapsforge, LGPL-3.0) and its SVG helper (Apache-2.0); see NOTICE.
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
